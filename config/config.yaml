# ==========================================
# Multimodal Transportation Digital Twin Config
# ==========================================

model:
  name: "Qwen/Qwen2-VL-7B-Instruct"  # Options: "gpt-4o", "Qwen/Qwen2-VL-7B-Instruct"
  llm_hidden_size: 3584              # Matches Qwen2-VL hidden dimension
  graph_embed_dim: 128
  gnn_type: "gcn"                    # Graph Attention Network
  use_vision_tokens: true

data:
  dataset_name: "METR-LA"
  h5_path: "data/raw/METR-LA/metr_la.h5"
  pkl_path: "data/raw/METR-LA/adj_mx.pkl"
  history_steps: 12
  pred_steps: 12
  # Additional multimodal feature toggles
  use_vision: true
  use_text_events: true
  use_weather_covariates: false

training:
  batch_size: 16
  epochs: 10
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  max_grad_norm: 1.0
  save_dir: "checkpoints"
  num_workers: 2